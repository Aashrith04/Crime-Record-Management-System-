name: CRMS Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test-and-lint:
    name: Backend Test & Type Checking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Test Suite
        env:
          ENVIRONMENT: testing
          DATABASE_URL: "sqlite:///./test_crms.db"
          SECRET_KEY: "test_jwt_secret_key_min_32_bytes_long"
        run: |
          cd backend
          pytest tests/

  frontend-build-and-typecheck:
    name: Frontend Typecheck & Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run TypeScript Type Check
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Build Next.js Production Bundle
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000/api/v1"
        run: |
          cd frontend
          npm run build
