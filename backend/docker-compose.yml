version: '3.8'

services:
  backend:
    build: .
    container_name: crms_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/crms_db
      - SECRET_KEY=crms_enterprise_super_secret_jwt_key_change_in_production_min_32_bytes
      - ENVIRONMENT=development
    depends_on:
      - db
    restart: always

  db:
    image: postgres:15-alpine
    container_name: crms_postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=crms_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
