version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: crms_postgres
    restart: always
    environment:
      POSTGRES_DB: crms_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: crms_secure_db_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crms_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: crms_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crms_backend
    restart: always
    environment:
      ENVIRONMENT: production
      DEBUG: "False"
      DATABASE_URL: postgresql://postgres:crms_secure_db_password_2026@postgres:5432/crms_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: crms_enterprise_super_secret_jwt_key_change_in_production_min_32_bytes
      CORS_ORIGINS: "http://localhost:3000,http://localhost"
    ports:
      - "8000:8000"
    volumes:
      - crms_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crms_frontend
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  crms_uploads:

networks:
  default:
    name: crms_network
